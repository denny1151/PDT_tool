name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - if: vars.PDT_MARKET_SNAPSHOT_URL == ''
        run: node scripts/refresh-market.mjs
      - env:
          PDT_REFRESH_API_URL: ${{ vars.PDT_REFRESH_API_URL }}
          PDT_MARKET_SNAPSHOT_URL: ${{ vars.PDT_MARKET_SNAPSHOT_URL }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const url = process.env.PDT_REFRESH_API_URL || '';
          const marketUrl = process.env.PDT_MARKET_SNAPSHOT_URL || '';
          if (url && !/^https:\/\/[a-z0-9-]+\.vercel\.app\/api\/refresh$/.test(url)) {
            throw new Error('PDT_REFRESH_API_URL must be the Vercel production /api/refresh URL');
          }
          if (marketUrl && !/^https:\/\/[a-z0-9]+\.public\.blob\.vercel-storage\.com\/market\.json$/.test(marketUrl)) {
            throw new Error('PDT_MARKET_SNAPSHOT_URL must be the public Vercel Blob market.json URL');
          }
          writeFileSync('site/data/refresh-api.json', JSON.stringify({ url, marketUrl }));
          JS
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
